<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설기 SHOP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
:root{
--bg:#f4f8ff;
--ink:#2f3e56;
--muted:#6c7d99;
--card:#ffffff;
--line:#d5e3f7;
--blue-soft:#eaf2ff;
--blue-mid:#d4e5ff;
--blue-btn:#dceaff;
--blue-btn-hover:#c7ddff;
--blue-accent:#7aa6e6;
--yellow-soft:#fcf8eb;
--yellow-line:#e6dab3;
--yellow-hover:#f5efd8;
--yellow-ink:#7d6830;
}
*{box-sizing:border-box}
body{
margin:0;
background:linear-gradient(180deg,#eef5ff 0%,#f6f9ff 48%,#f1f6ff 100%);
color:var(--ink);
font-family:'Jua',sans-serif;
font-size:16px;
}
header{
background:var(--blue-soft);
padding:0;
text-align:center;
border-bottom:1.5px solid var(--line);
position:relative;
overflow:hidden;
}
.header-banner-img{
width:100%;
max-width:900px;
max-height:300px;
object-fit:cover;
border:none;
box-shadow:none;
border-radius:0;
display:block;
margin:0 auto;
}
.header-banner-img.hidden{display:none!important}
.header-ribbon{
position:absolute;
left:50%;
bottom:10px;
transform:translateX(-50%);
background:rgba(255,255,255,.94);
border:1.5px solid var(--line);
border-radius:999px;
padding:3px 14px;
font-size:12px;
color:var(--ink);
box-shadow:0 3px 10px rgba(88,122,175,.12);
pointer-events:none;
white-space:nowrap;
animation:ribbonFloat 3s ease-in-out infinite;
}

.wrap{max-width:780px;margin:0 auto;padding:14px 14px 40px}

/* 상단 브랜드 바 */
.brand-bar{
background:var(--card);
border:1.5px solid var(--line);
border-radius:22px;
padding:12px 16px;
margin-bottom:12px;
box-shadow:0 4px 16px rgba(96,128,178,.08);
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}
.brand-title{
font-size:21px;
color:var(--ink);
display:flex;
align-items:center;
gap:8px;
}
.brand-paw{
display:inline-block;
animation:pawWiggle 2.8s ease-in-out infinite;
transform-origin:center bottom;
}

.main-tabs{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:12px;
}
.main-tabs button{
padding:10px 8px;
font-size:15px;
border-radius:18px;
background:var(--card);
border:1.5px solid var(--line);
color:var(--ink);
box-shadow:0 3px 10px rgba(96,128,178,.06);
display:flex;
align-items:center;
justify-content:center;
gap:6px;
min-height:42px;
}
.main-tabs button:hover:not(:disabled){
background:var(--blue-soft);
}
.main-tabs button.active{
background:var(--blue-mid);
border-color:#b7d1fa;
color:var(--ink);
box-shadow:0 4px 12px rgba(122,166,230,.2);
}

/* 공지 배너: 위 3개 탭과 동일한 높이로 맞춤 + 차분한 크림 옐로우 */
.notice-banner{
background:var(--yellow-soft);
border:1.5px solid var(--yellow-line);
border-radius:18px;
min-height:42px;
padding:10px 14px;
font-size:14px;
line-height:1.35;
margin-bottom:12px;
box-shadow:0 3px 10px rgba(96,128,178,.06);
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:var(--ink);
}
.notice-banner:empty{display:none}

.sync-pill{
display:inline-block;
margin-top:6px;
background:var(--blue-soft);
border:1.5px solid var(--line);
border-radius:999px;
padding:3px 12px;
font-size:12px;
}

.toolbar,.panel{
background:var(--card);
border:1.5px solid var(--line);
border-radius:22px;
box-shadow:0 4px 16px rgba(96,128,178,.08);
padding:14px;
margin-bottom:14px;
}

input,select,textarea,button{
font:inherit;
border:1.5px solid var(--line);
border-radius:15px;
padding:9px 12px;
background:#fcfdff;
color:var(--ink);
}
input,select,textarea{width:100%;min-width:0}
input:focus,select:focus,textarea:focus{
outline:none;
border-color:var(--blue-accent);
box-shadow:0 0 0 3px rgba(122,166,230,.18);
}

/* 커스텀 드롭다운 트리거 */
.select-field{
position:relative;
display:block;
width:100%;
min-width:0;
}
.select-field select{
display:none;
}
.select-btn{
width:100%;
min-width:0;
text-align:left;
font-weight:normal;
background:#fcfdff;
border:1.5px solid var(--line);
border-radius:15px;
padding:9px 26px 9px 10px;
color:var(--ink);
box-shadow:none;
position:relative;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.select-btn::after{
content:'';
position:absolute;
right:10px;
top:50%;
width:6px;
height:6px;
border-right:1.5px solid var(--muted);
border-bottom:1.5px solid var(--muted);
transform:translateY(-65%) rotate(45deg);
pointer-events:none;
}
.select-btn:hover:not(:disabled){
background:#f7faff;
border-color:var(--blue-accent);
transform:none;
}
.select-btn:disabled{
opacity:.5;
cursor:not-allowed;
}

button{
cursor:pointer;
background:var(--blue-btn);
border-color:#c2d9fc;
font-weight:bold;
transition:transform .14s cubic-bezier(.34,1.56,.64,1),background-color .14s ease,box-shadow .14s ease;
box-shadow:0 2px 6px rgba(96,128,178,.08);
}
button:hover:not(:disabled){
background:var(--blue-btn-hover);
transform:translateY(-2px);
}
button:active:not(:disabled){
transform:scale(.97);
}
button:disabled{
opacity:.5;
cursor:not-allowed;
box-shadow:none;
}
button.primary{
background:var(--yellow-soft);
border-color:var(--yellow-line);
color:var(--ink);
}
button.primary:hover:not(:disabled){
background:var(--yellow-hover);
}
button.order-btn{
background:var(--blue-btn);
border-color:#c2d9fc;
color:var(--ink);
}
button.order-btn:hover:not(:disabled){
background:var(--blue-btn-hover);
}
button.danger{
background:#ffe4ec;
border-color:#f2c9d6;
}
button.small{
padding:6px 11px;
font-size:13px;
width:auto;
border-radius:12px;
}

.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flex>*{flex:1}

/* 필터 줄: 검색창 1줄, 필터/정렬 2열 그리드 */
.filter-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}
.filter-grid .wide{
grid-column:1/-1;
}

/* 상품 카드 2열 그리드 */
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}
.item{
background:var(--card);
border:1.5px solid var(--line);
border-radius:22px;
overflow:hidden;
box-shadow:0 4px 16px rgba(96,128,178,.08);
display:flex;
flex-direction:column;
transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s ease;
animation:cardPopIn .32s ease both;
}
.item[data-order-id]{
cursor:pointer;
}
.item:hover{
transform:translateY(-4px);
box-shadow:0 10px 22px rgba(96,128,178,.16);
}
.item:hover img,.item:hover .placeholder{
transform:scale(1.04);
}
.item.soldout{
opacity:.76;
background:#f8fafe;
cursor:default;
}
.item.soldout[data-order-id]{
cursor:pointer;
}
.item.soldout:hover{
transform:none;
box-shadow:0 4px 16px rgba(96,128,178,.08);
}
.item.soldout[data-order-id]:hover{
transform:translateY(-3px);
box-shadow:0 8px 20px rgba(96,128,178,.14);
}
.item-media{
position:relative;
margin:8px 8px 0;
border-radius:16px;
overflow:hidden;
border:1.5px solid #dce8fa;
background:linear-gradient(135deg,#eef5ff 0%,#e5f4ff 100%);
}
.item img,.placeholder{
width:100%;
height:132px;
object-fit:cover;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
transition:transform .25s ease;
}
.soldout-badge{
position:absolute;
inset:0;
background:rgba(47,62,86,.55);
color:#fff;
font-size:14px;
font-weight:bold;
display:flex;
align-items:center;
justify-content:center;
letter-spacing:1px;
}
.itembody{
padding:10px 12px 12px;
display:flex;
flex-direction:column;
flex:1;
}
.item-tags{
display:flex;
align-items:center;
justify-content:space-between;
gap:4px;
flex-wrap:nowrap;
}
.item-tags-left{
display:flex;
align-items:center;
gap:4px;
flex-wrap:nowrap;
min-width:0;
}
.item h3{
margin:7px 0 6px;
font-size:15px;
line-height:1.3;
color:var(--ink);
}
.muted{
color:var(--muted);
font-size:12px;
line-height:1.35;
}
.item-price-row{
margin-top:auto;
display:flex;
align-items:baseline;
justify-content:space-between;
gap:6px;
flex-wrap:wrap;
}
.price{
font-size:15px;
color:#4f7ec9;
font-weight:bold;
}
.item-stock{
font-size:12px;
color:var(--muted);
white-space:nowrap;
}
.tag{
display:inline-block;
border-radius:999px;
padding:2px 8px;
background:var(--blue-soft);
border:1px solid #cfe0fa;
color:#4a638a;
font-size:11px;
white-space:nowrap;
flex-shrink:0;
}
.tag.grade-ur{
background:var(--yellow-soft);
border-color:var(--yellow-line);
color:var(--yellow-ink);
}
.tag.grade-sr{
background:#f3ecff;
border-color:#d9c6fa;
color:#6d4ca8;
}
.tag.grade-r{
background:#e6f6ff;
border-color:#bfe5fc;
color:#3b7ea8;
}
.tag.ok{
background:#ffecef;
border-color:#f7c5ce;
color:#b84a5e;
}
.tag.sold{
background:#edf1f7;
border-color:#d6deeb;
color:#78869c;
}

/* 하단 관리자 모드 버튼 */
.admin-footer{
margin-top:22px;
text-align:center;
}
.admin-footer button{
width:auto;
min-width:160px;
padding:10px 18px;
background:var(--card);
border:1.5px solid var(--line);
border-radius:999px;
color:var(--muted);
font-size:14px;
}
.admin-footer button.active{
background:var(--blue-mid);
border-color:#b7d1fa;
color:var(--ink);
}

.orders{display:flex;flex-direction:column;gap:10px}
.order{
border:1.5px solid var(--line);
border-radius:18px;
padding:11px;
background:#fbfdff;
display:flex;
flex-direction:column;
gap:8px;
animation:cardPopIn .28s ease both;
}
.order-top{display:flex;gap:10px;align-items:flex-start}
.order-thumb{
width:48px;
height:48px;
border-radius:14px;
border:1.5px solid var(--line);
object-fit:cover;
background:var(--blue-soft);
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
flex-shrink:0;
}
.order-info{flex:1;min-width:0}
.order-title{font-size:15px;font-weight:bold;word-break:break-word;line-height:1.35;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wait-badge{
display:inline-flex;
align-items:center;
justify-content:center;
min-width:22px;
height:22px;
padding:0 7px;
border-radius:999px;
background:var(--blue-mid);
border:1px solid #b7d1fa;
color:var(--ink);
font-size:12px;
font-weight:bold;
}
.order-sub{font-size:13px;color:var(--muted);margin-top:2px;word-break:break-word}
.order-money{font-size:14px;color:#4f7ec9;font-weight:bold;margin-top:3px}
.order-meta{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
flex-wrap:wrap;
padding-top:6px;
border-top:1px dashed var(--line);
}
.order-times{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.order-actions{display:flex;gap:6px;align-items:center}
.order-count-badge{
display:inline-block;
background:var(--blue-soft);
border:1.5px solid var(--line);
color:#4a638a;
border-radius:999px;
padding:4px 12px;
font-size:13px;
margin-bottom:10px;
}

.sales-header{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
flex-wrap:wrap;
margin-bottom:10px;
}
.sales-header h3{
margin:0;
}
.sales-scroll{
max-height:260px;
overflow-y:auto;
padding-right:2px;
}
.sales-group{
border:1.5px solid var(--line);
border-radius:18px;
padding:12px;
background:#fbfdff;
margin-bottom:12px;
}
.sales-group:last-child{
margin-bottom:0;
}
.sales-group-head{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
flex-wrap:wrap;
padding-bottom:8px;
margin-bottom:8px;
border-bottom:1.5px solid var(--line);
}
.sales-date{font-size:16px;font-weight:bold}
.sales-total{
font-size:14px;
font-weight:bold;
color:#4f7ec9;
background:var(--blue-soft);
border:1.5px solid #cfe0fa;
border-radius:999px;
padding:3px 11px;
}
.sales-row{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
padding:7px 0;
border-bottom:1px dashed var(--line);
font-size:14px;
}
.sales-row:last-child{border-bottom:none;padding-bottom:0}
.sales-row-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.sales-row-right{text-align:right;white-space:nowrap}

.sectiontitle{margin:0 0 12px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.formgrid .wide{grid-column:1/-1}
.register-row-3{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}
.register-row-2{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
}
.hidden{display:none!important}
.notice{
background:var(--yellow-soft);
border:1.5px solid var(--yellow-line);
border-radius:16px;
padding:11px 14px;
font-size:14px;
margin-bottom:12px;
}

.modal-backdrop{
position:fixed;
inset:0;
background:rgba(47,62,86,.42);
display:flex;
align-items:center;
justify-content:center;
padding:16px;
z-index:100;
animation:fadeIn .18s ease;
}
.modal{
background:var(--card);
border:1.5px solid var(--line);
border-radius:24px;
box-shadow:0 10px 30px rgba(47,62,86,.18);
max-width:440px;
width:100%;
max-height:92vh;
overflow-y:auto;
padding:18px;
animation:modalPop .22s cubic-bezier(.34,1.56,.64,1);
}
.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}
.modal-head h3{margin:0}
.modal-close{
width:auto;
padding:4px 10px;
background:var(--blue-soft);
border-radius:999px;
}
.modal-summary{
background:var(--blue-soft);
border:1.5px solid var(--line);
border-radius:18px;
padding:10px;
margin-bottom:12px;
font-size:15px;
display:flex;
flex-direction:column;
gap:10px;
}
.modal-imgs-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}
.modal-summary-img{
width:100%;
height:152px;
border-radius:14px;
border:1.5px solid var(--line);
object-fit:cover;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
}
.order-input-row{
display:grid;
grid-template-columns:1.3fr .7fr;
gap:10px;
align-items:start;
}
.order-field-label{
display:block;
margin-bottom:5px;
white-space:nowrap;
}
.modal-total{
margin:12px 0;
padding:10px 12px;
background:var(--yellow-soft);
border:1.5px solid var(--yellow-line);
border-radius:16px;
display:flex;
justify-content:space-between;
font-weight:bold;
}

/* 누른 버튼 바로 아래에 딱 붙는 작은 드롭다운 메뉴 */
.picker-box{
position:fixed;
background:var(--card);
border:1.5px solid var(--line);
border-radius:16px;
box-shadow:0 8px 22px rgba(47,62,86,.18);
max-height:220px;
display:flex;
flex-direction:column;
overflow:hidden;
z-index:300;
animation:fadeIn .12s ease;
}
.picker-list{
padding:4px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:2px;
}
.picker-option{
width:100%;
text-align:left;
padding:7px 10px;
font-size:13px;
font-weight:normal;
border-radius:11px;
background:transparent;
border:1px solid transparent;
box-shadow:none;
color:var(--ink);
display:flex;
align-items:center;
justify-content:space-between;
}
.picker-option:hover:not(:disabled){
background:var(--blue-soft);
transform:none;
}
.picker-option.selected{
background:var(--yellow-soft);
border-color:var(--yellow-line);
color:var(--yellow-ink);
font-weight:bold;
}

@keyframes ribbonFloat{
0%,100%{transform:translate(-50%,0)}
50%{transform:translate(-50%,-4px)}
}
@keyframes pawWiggle{
0%,100%{transform:rotate(0deg)}
20%{transform:rotate(-12deg)}
40%{transform:rotate(10deg)}
60%{transform:rotate(-5deg)}
}
@keyframes cardPopIn{
from{opacity:0;transform:translateY(8px) scale(.98)}
to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes fadeIn{
from{opacity:0}
to{opacity:1}
}
@keyframes modalPop{
from{opacity:0;transform:scale(.92) translateY(8px)}
to{opacity:1;transform:scale(1) translateY(0)}
}

@media(prefers-reduced-motion:reduce){
,::before,*::after{
animation-duration:.01ms!important;
animation-iteration-count:1!important;
transition-duration:.01ms!important;
}
}

@media(max-width:600px){
.grid{gap:10px}
.item{border-radius:20px}
.item-media{margin:7px 7px 0;border-radius:14px}
.item img,.placeholder{height:115px;font-size:36px}
.itembody{padding:9px 10px 11px}
.item h3{font-size:14px}
.tag{padding:2px 7px;font-size:10px}
.price{font-size:14px}
.itembody p{font-size:12px!important;margin:0 0 8px!important}
.itembody button{padding:7px;font-size:13px;border-radius:14px}
.flex>*{flex-basis:100%}
.header-banner-img{max-height:240px}
.header-ribbon{font-size:11px;padding:2px 11px;bottom:8px}
.modal-summary-img{height:132px}
.select-btn{padding:9px 22px 9px 8px;font-size:14px}
}
</style>
</head>
<body>
<header>
<img id="headerImg" class="header-banner-img hidden" alt="상단 이미지">
<span class="header-ribbon">✦ WELCOME ✦</span>
</header>

<div class="wrap">
<div class="brand-bar">
<div class="brand-title"><span class="brand-paw">🐾</span><span>설기 SHOP</span></div>
</div>

<div class="main-tabs">
<button id="itemTabBtn" type="button" class="active" data-view="아이템">아이템</button>
<button id="furnitureTabBtn" type="button" data-view="가구">가구</button>
<button id="ordersTabBtn" type="button" data-view="orders">주문 현황</button>
</div>

<div id="shopNotice" class="notice-banner"></div>

<section id="shopSection">
<div class="toolbar">
<div class="filter-grid">
<input id="search" class="wide" placeholder="어떤 아이템을 찾고 있나요?">
<span class="select-field"><select id="categoryFilter"><option value="">전체 카테고리</option></select></span>
<span class="select-field"><select id="gradeFilter">
<option value="">전체 등급</option>
<option value="UR">UR</option>
<option value="SR">SR</option>
<option value="R">R</option>
</select></span>
<span class="select-field"><select id="statusFilter">
<option value="">전체 상태</option>
<option value="available">판매중</option>
<option value="soldout">판매 완료</option>
</select></span>
<span class="select-field"><select id="sortFilter">
<option value="default">기본 정렬</option>
<option value="priceAsc">가격 낮은순 (오름차순)</option>
<option value="priceDesc">가격 높은순 (내림차순)</option>
</select></span>
</div>
</div>
<div id="items" class="grid"></div>
</section>

<section id="ordersSection" class="hidden">
<div class="panel">
<h2 class="sectiontitle">주문 현황</h2>
<div id="ordersCount" class="order-count-badge">대기 0건 · 완료 0건</div>
<div id="publicOrders" class="orders"></div>
</div>
</section>

<section id="adminSection" class="hidden">
<div class="panel">
<h2>관리자 모드</h2>

/* 클릭 시 짧게 울리는 물방울 효과음 (Web Audio API) */
var sfxCtx = null;
function playWaterDrop() {
try {
var AudioCtx = window.AudioContext || window.webkitAudioContext;
if (!AudioCtx) return;
if (!sfxCtx) sfxCtx = new AudioCtx();
if (sfxCtx.state === 'suspended') {
sfxCtx.resume().catch(function(){});
}
var now = sfxCtx.currentTime;
var osc = sfxCtx.createOscillator();
var gain = sfxCtx.createGain();
osc.type = 'sine';
osc.frequency.setValueAtTime(520, now);
osc.frequency.exponentialRampToValueAtTime(1180, now + 0.085);

gain.gain.setValueAtTime(0.0001, now);
gain.gain.exponentialRampToValueAtTime(0.07, now + 0.012);
gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);

osc.connect(gain);
gain.connect(sfxCtx.destination);
osc.start(now);
osc.stop(now + 0.12);
} catch (e) {}
}

function syncSelectButton(sel) {
if (!sel) return;
var field = sel.closest ? sel.closest('.select-field') : null;
if (!field) return;
var btn = field.querySelector('.select-btn');
if (!btn) return;
btn.disabled = !!sel.disabled;
var opt = sel.options[sel.selectedIndex] || sel.options[0];
btn.textContent = opt ? opt.textContent : '';
}

function enhanceSelectFields() {
var fields = document.querySelectorAll('.select-field');
for (var i = 0; i < fields.length; i++) {
var field = fields[i];
var sel = field.querySelector('select');
if (!sel) continue;
var btn = field.querySelector('.select-btn');
if (!btn) {
btn = document.createElement('button');
btn.type = 'button';
btn.className = 'select-btn';
field.insertBefore(btn, sel);
}
syncSelectButton(sel);
}
}

function openPickerForSelect(sel, triggerBtn) {
if (!sel || sel.disabled) return;
activePickerSelect = sel;
activePickerBtn = triggerBtn || null;

var listEl = document.getElementById('pickerList');
var html = '';
for (var i = 0; i < sel.options.length; i++) {
var opt = sel.options[i];
var isSel = opt.value === sel.value;
html += '<button type="button" class="picker-option' + (isSel ? ' selected' : '') + '" data-picker-idx="' + i + '">' +
'<span>' + esc(opt.textContent) + '</span>' +
(isSel ? '<span>✓</span>' : '') +
'</button>';
}
listEl.innerHTML = html;

var box = document.getElementById('pickerBox');
box.classList.remove('hidden');

var anchor = triggerBtn || sel;
var rect = anchor.getBoundingClientRect();
var boxWidth = Math.max(rect.width, 120);
box.style.width = boxWidth + 'px';

var left = rect.left;
if (left + boxWidth > window.innerWidth - 8) {
left = window.innerWidth - boxWidth - 8;
}
if (left < 8) left = 8;
box.style.left = left + 'px';

var boxHeight = box.offsetHeight || 180;
var top = rect.bottom + 4;
if (top + boxHeight > window.innerHeight - 8) {
top = Math.max(8, rect.top - boxHeight - 4);
}
box.style.top = top + 'px';
}

function closePickerModal() {
activePickerSelect = null;
activePickerBtn = null;
document.getElementById('pickerBox').classList.add('hidden');
}

document.getElementById('pickerBox').addEventListener('click', function(e) {
e.stopPropagation();
var btn = e.target && e.target.closest ? e.target.closest('[data-picker-idx]') : null;
if (!btn || !activePickerSelect) return;
playWaterDrop();
var idx = parseInt(btn.getAttribute('data-picker-idx'), 10);
if (!isNaN(idx) && activePickerSelect.options[idx]) {
activePickerSelect.selectedIndex = idx;
syncSelectButton(activePickerSelect);
activePickerSelect.dispatchEvent(new Event('change', { bubbles: true }));
}
closePickerModal();
});

document.addEventListener('click', function(e) {
var box = document.getElementById('pickerBox');
var btn = e.target && e.target.closest ? e.target.closest('.select-btn') : null;

if (btn) {
var field = btn.closest ? btn.closest('.select-field') : null;
var sel = field ? field.querySelector('select') : null;
if (!sel || sel.disabled) return;
e.stopPropagation();
playWaterDrop();
if (!box.classList.contains('hidden') && activePickerSelect === sel) {
closePickerModal();
return;
}
openPickerForSelect(sel, btn);
return;
}

if (!box.classList.contains('hidden') && !box.contains(e.target)) {
closePickerModal();
}

var clickableBtn = e.target && e.target.closest ? e.target.closest('button:not(:disabled)') : null;
if (clickableBtn && !clickableBtn.classList.contains('select-btn') && !clickableBtn.classList.contains('picker-option')) {
playWaterDrop();
}
});

function formatPrice(val) {
var num = Number(val);
if (isNaN(num)) return '0원';
return Math.round(num).toLocaleString('ko-KR') + '원';
}

function normalizeGrade(val) {
var g = String(val || '').toUpperCase().trim();
if (g === 'UR' || g === 'SR' || g === 'R') return g;
return 'SR';
}

function getGradeBadgeClass(grade) {
var g = normalizeGrade(grade);
if (g === 'UR') return 'grade-ur';
if (g === 'R') return 'grade-r';
return 'grade-sr';
}

function toArray(val) {
if (!val) return [];
if (Array.isArray(val)) return val.filter(Boolean);
return Object.keys(val).map(function(k) { return val[k]; }).filter(Boolean);
}

function formatStamp(d) {
var dt = d instanceof Date ? d : new Date(d || Date.now());
return ('0' + dt.getHours()).slice(-2) + ':' +
('0' + dt.getMinutes()).slice(-2) + ':' +
('0' + dt.getSeconds()).slice(-2);
}

function formatDateKey(d) {
var dt = d instanceof Date ? d : new Date(d || Date.now());
return dt.getFullYear() + '-' +
('0' + (dt.getMonth() + 1)).slice(-2) + '-' +
('0' + dt.getDate()).slice(-2);
}

function readAndCompressImage(file, maxWidth, quality) {
return new Promise(function(resolve, reject) {
if (!file) { resolve(''); return; }
var reader = new FileReader();
reader.onerror = function() { reject(new Error('이미지를 읽을 수 없어요.')); };
reader.onload = function() {
var raw = String(reader.result || '');
if (!raw) { resolve(''); return; }
var img = new Image();
img.onerror = function() { resolve(raw); };
img.onload = function() {
try {
var w = img.naturalWidth || img.width || maxWidth;
var h = img.naturalHeight || img.height || 240;
if (w > maxWidth) {
h = Math.round((h * maxWidth) / w);
w = maxWidth;
}
var canvas = document.createElement('canvas');
canvas.width = w;
canvas.height = h;
var ctx = canvas.getContext('2d');
ctx.drawImage(img, 0, 0, w, h);
var out = canvas.toDataURL('image/jpeg', quality || 0.85);
resolve(out || raw);
} catch (e) {
resolve(raw);
}
};
img.src = raw;
};
reader.readAsDataURL(file);
});
}

content: '🛍 새 주문이 완료됐어요! (대기 ' + queueNumber + '번)\n' +

try {
fetch(url, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload)
}).catch(function() {});
} catch (e) {}
}

function esc(str) {
return String(str == null ? '' : str)
.replace(/&/g, '&')
.replace(/</g, '<')
.replace(/>/g, '>')
.replace(/"/g, '"');
}

function findItem(id) {
for (var i = 0; i < data.items.length; i++) {
if (data.items[i].id === id) return data.items[i];
}
return null;
}

function populateOrderQtyOptions(maxStock) {
var sel = document.getElementById('orderQty');
var stock = Math.max(0, parseInt(maxStock, 10) || 0);
if (stock < 1) {
sel.innerHTML = '<option value="0">품절</option>';
sel.value = '0';
sel.disabled = true;
syncSelectButton(sel);
return;
}
var opts = '';
for (var i = 1; i <= stock; i++) {
opts += '<option value="' + i + '">' + i + '</option>';
}
sel.innerHTML = opts;
sel.disabled = false;
sel.value = '1';
syncSelectButton(sel);
}

function recordSale(order, doneNow) {
var item = findItem(order.itemId);
var unitPrice = Number(order.price != null ? order.price : (item ? item.price : 0)) || 0;
var qty = Number(order.qty) || 1;
var totalPrice = unitPrice * qty;
var exists = false;
for (var i = 0; i < data.salesLog.length; i++) {
if (data.salesLog[i].orderId === order.id) {
exists = true;
break;
}
}
if (!exists) {
data.salesLog.push({
id: String(Date.now()) + '_' + Math.random().toString(36).slice(2, 7),
orderId: order.id,
itemName: order.itemName,
image: order.image || (item ? item.image : ''),
nick: order.nick,
qty: qty,
unitPrice: unitPrice,
totalPrice: totalPrice,
orderTime: order.time || formatStamp(order.created),
processedTime: formatStamp(doneNow),
dateKey: formatDateKey(doneNow),
created: doneNow
});
}
}

var e = document.getElementById('editCat');
var opts = ITEM_CATS.map(function(c) {

function renderShop() {
syncTabs();
var q = document.getElementById('search').value.toLowerCase();
var cat = document.getElementById('categoryFilter').value;
var grade = document.getElementById('gradeFilter').value;
var status = document.getElementById('statusFilter').value;
var sort = document.getElementById('sortFilter').value;

var list = data.items.filter(function(x) {
var isSoldOut = Number(x.stock) <= 0;
var matchStatus = !status || (status === 'soldout' ? isSoldOut : !isSoldOut);
var itemGrade = normalizeGrade(x.grade);
var matchGrade = !grade || itemGrade === grade;
return (x.type || '아이템') === currentType &&
String(x.name || '').toLowerCase().indexOf(q) !== -1 &&
(!cat || x.cat === cat) &&
matchGrade &&
matchStatus;
});

if (sort === 'priceAsc') {
list = list.slice().sort(function(a, b) {
return (Number(a.price) || 0) - (Number(b.price) || 0);
});
} else if (sort === 'priceDesc') {
list = list.slice().sort(function(a, b) {
return (Number(b.price) || 0) - (Number(a.price) || 0);
});
}

document.getElementById('items').innerHTML = list.length ? list.map(function(x, idx) {
var isSoldOut = Number(x.stock) <= 0;
var itemGrade = normalizeGrade(x.grade);
var gradeClass = getGradeBadgeClass(itemGrade);
var imgHtml = x.image
? '<img src="' + x.image + '" alt="' + esc(x.name) + '"><div class="placeholder" style="display:none">🎁</div>'
: '<div class="placeholder">🎁</div>';
var clickable = logged || !isSoldOut;
var delayStyle = ' style="animation-delay:' + Math.min(idx * 45, 360) + 'ms"';
return '<article class="item' + (isSoldOut ? ' soldout' : '') + '"' + (clickable ? ' data-order-id="' + esc(x.id) + '"' : '') + delayStyle + '>' +
'<div class="item-media">' +
imgHtml +
(isSoldOut ? '<div class="soldout-badge">판매 완료</div>' : '') +
'</div>' +
'<div class="itembody">' +
'<div class="item-tags">' +
'<div class="item-tags-left">' +
'<span class="tag ' + gradeClass + '">' + esc(itemGrade) + '</span>' +
'<span class="tag">' + esc(x.cat) + '</span>' +
'</div>' +
'<span class="tag ' + (isSoldOut ? 'sold' : 'ok') + '">' + (isSoldOut ? '판매 완료' : '판매중') + '</span>' +
'</div>' +
'<h3>' + esc(x.name) + '</h3>' +
'<div class="item-price-row">' +
'<span class="price">' + formatPrice(x.price) + '</span>' +
'<span class="item-stock">재고 <b>' + x.stock + '</b>개</span>' +
'</div>' +
'</div>' +
'</article>';

}

function renderSalesHistory() {
var logs = data.salesLog.slice().sort(function(a, b) {
return (b.created || 0) - (a.created || 0);
});
var grandTotal = 0;
for (var i = 0; i < logs.length; i++) {
grandTotal += Number(logs[i].totalPrice) || 0;
}
document.getElementById('salesSummaryBadge').textContent =
'누적 총 판매 금액: ' + formatPrice(grandTotal) + ' (총 ' + logs.length + '건)';

if (!logs.length) {
document.getElementById('salesHistory').innerHTML = '<div class="muted">아직 완료된 거래 내역이 없어요.</div>';
return;
}

var groups = {};
var dateOrder = [];
for (var j = 0; j < logs.length; j++) {
var entry = logs[j];
var dk = entry.dateKey || formatDateKey(entry.created);
if (!groups[dk]) {
groups[dk] = { dateKey: dk, total: 0, items: [] };
dateOrder.push(dk);
}
groups[dk].total += Number(entry.totalPrice) || 0;
groups[dk].items.push(entry);
}

document.getElementById('salesHistory').innerHTML = dateOrder.map(function(dk) {
var grp = groups[dk];
var rowsHtml = grp.items.map(function(it) {
var thumb = it.image
? '<img class="order-thumb" style="width:36px;height:36px;font-size:16px" src="' + it.image + '" alt="' + esc(it.itemName) + '">'
: '<div class="order-thumb" style="width:36px;height:36px;font-size:16px">🎁</div>';
return '<div class="sales-row">' +
'<div class="sales-row-left">' +
thumb +
'<div>' +
'<div><b>' + esc(it.itemName) + '</b> <span class="muted">· ' + esc(it.nick) + ' · 구매 수량 ' + it.qty + '개</span></div>' +
'<div class="muted">주문 ' + esc(it.orderTime || '-') + ' · 처리 ' + esc(it.processedTime || '-') + '</div>' +
'</div>' +
'</div>' +
'<div class="sales-row-right"><b>' + formatPrice(it.totalPrice) + '</b></div>' +
'</div>';
}).join('');

return '<div class="sales-group">' +
'<div class="sales-group-head">' +
'<span class="sales-date">' + esc(dk) + ' (' + grp.items.length + '건)</span>' +
'<span class="sales-total">총 판매 금액 ' + formatPrice(grp.total) + '</span>' +
'</div>' +
rowsHtml +
'</div>';
}).join('');
}

document.getElementById('submitOrderBtn').onclick = function() {
var item = findItem(activeOrderItemId);
var currentStock = item ? Math.max(0, parseInt(item.stock, 10) || 0) : 0;
if (!item || currentStock < 1) { closeOrderModal(); return; }
var nick = document.getElementById('orderNick').value.trim();
var qty = parseInt(document.getElementById('orderQty').value, 10);
if (!nick) { alert('게임 닉네임을 입력해 주세요.'); return; }
if (!/#\d+/.test(nick)) {
alert('닉네임 뒤에 #번호를 함께 입력해 주세요. (예: 설기#005)');
return;
}
if (!qty || qty < 1 || qty > currentStock) { alert('구매 수량을 확인해 주세요. (최대 ' + currentStock + '개)'); return; }

var now = new Date();
var stamp = formatStamp(now);
var unitPrice = Number(item.price) || 0;
var totalPrice = unitPrice * qty;

item.stock = Math.max(0, currentStock - qty);

var newOrder = {
id: String(Date.now()) + '_' + Math.random().toString(36).slice(2, 7),
itemId: item.id,
itemName: item.name,
image: item.image || '',
price: unitPrice,
nick: nick,
qty: qty,
time: stamp,
processedTime: '',
created: now.getTime(),
updated: now.getTime(),
status: '대기'
};

data.orders.push(newOrder);
var pendingCount = data.orders.filter(function(o) { return o.status === '대기'; }).length;

save();
sendDiscordOrderNotification(newOrder, totalPrice, pendingCount);
closeOrderModal();
renderShop();
renderOrders();
alert('구매 신청이 완료됐어요!');
};

if (!logged) return;
var cid = t.getAttribute('data-cancel-id');
for (var j = 0; j < data.orders.length; j++) {
var o = data.orders[j];
if (o.id === cid) {
var it = findItem(o.itemId);
var cancelNow = Date.now();
if (it) it.stock = Number(it.stock || 0) + Number(o.qty || 0);
o.status = '취소';
o.processedTime = formatStamp(cancelNow);
o.updated = cancelNow;
}
}
save(); renderShop(); renderAdmin(); renderOrders();
}
};

if (db && rootRef) {
try {
db.ref('.info/connected').on('value', function(snap) {
var el = document.getElementById('syncStatus');
if (!el) return;
if (snap.val() === true) {
el.textContent = '🟢 실시간 공용 DB 연결됨';
} else {
el.textContent = '🟡 연결 확인 중...';
}
});

rootRef.on('value', function(snap) {
var val = snap.val();
if (!val && !initialized) {
initialized = true;
save();
return;
}
initialized = true;
val = val || {};
data.items = toArray(val.items).map(function(it) {
return Object.assign({}, it, { grade: normalizeGrade(it.grade) });
});
data.orders = toArray(val.orders);
data.salesLog = toArray(val.salesLog);
data.notice = typeof val.notice === 'string' ? val.notice : '';
data.header = val.header && typeof val.header === 'object'
? val.header
: { color: '#eaf2ff', image: '' };
data.webhookUrl = typeof val.webhookUrl === 'string' && val.webhookUrl
? val.webhookUrl
: DEFAULT_DISCORD_WEBHOOK_URL;

renderNotice();
renderHeader();
renderShop();
renderOrders();
if (logged) renderAdmin();
}, function(err) {
var el = document.getElementById('syncStatus');
if (el) el.textContent = '🔴 DB 연결 실패 (' + (err && err.code ? err.code : '권한 확인 필요') + ')';
});
} catch (e) {
var el = document.getElementById('syncStatus');
if (el) el.textContent = '🟡 로컬 화면 모드 (DB 연결 대기)';
}
} else {
var el = document.getElementById('syncStatus');
if (el) el.textContent = '🟡 로컬 화면 모드 (DB 연결 대기)';
}

fillCats();
renderNotice();
renderHeader();
renderShop();
syncAdminView();
})();
</script>
</body>
</html>
