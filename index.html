<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIXEL ITEM SHOP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Jua&display=swap');
:root{--ink:#302744;--pink:#f5b8d2;--pink2:#ffe4ef;--mint:#bdebdc;--cream:#fffaf0;--purple:#8d75bb}
{box-sizing:border-box}
body{margin:0;background:#f8f2ff;color:var(--ink);font-family:'Jua',sans-serif;font-size:16px}
header{background:#ffd9e9;background-size:cover;background-position:center;padding:26px 14px 22px;text-align:center;border-bottom:3px solid var(--ink);position:relative}
.header-custom{max-width:900px;margin:0 auto 8px;text-align:center;background:#fff9;border:1px solid #fff;border-radius:10px;padding:7px 10px;font-size:13px}
.header-custom:empty{display:none}
.logo{font:clamp(24px,6vw,42px) 'Press Start 2P','Jua',sans-serif;letter-spacing:1px;line-height:1.4;color:#614b8e}
.notice-banner{max-width:780px;margin:12px auto 0;background:#fffaf0;border:2px solid var(--ink);border-radius:10px;padding:7px 12px;font-size:14px;box-shadow:3px 3px 0 var(--ink)}
.notice-banner:empty{display:none}
.sync-pill{display:inline-block;margin-top:8px;background:#ffffffcc;border:1.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:12px}
.wrap{max-width:960px;margin:16px auto;padding:0 12px 24px}
.toolbar,.panel{background:white;border:2px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:12px;margin-bottom:16px}
input,select,textarea,button{font:inherit;border:2px solid var(--ink);border-radius:9px;padding:9px;background:#fff;color:var(--ink)}
input,select,textarea{width:100%;min-width:0}
button{cursor:pointer;background:#e8ddff;font-weight:bold}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:#bdebdc}
button.danger{background:#ffd4df}
button.small{padding:6px 10px;font-size:13px;width:auto}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flex>{flex:1}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1}
.tabs button.active{background:#302744;color:white}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.item{background:white;border:2px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column}
.item.soldout{opacity:.78;background:#faf8fd}
.item-media{position:relative}
.item img,.placeholder{width:100%;height:130px;object-fit:cover;background:#f3eaff;display:flex;align-items:center;justify-content:center;font-size:44px}
.soldout-badge{position:absolute;inset:0;background:rgba(48,39,68,.55);color:#fff;font-size:16px;font-weight:bold;display:flex;align-items:center;justify-content:center;letter-spacing:1px}
.itembody{padding:10px;display:flex;flex-direction:column;flex:1}
.item h3{margin:6px 0 4px;font-size:17px;line-height:1.25}
.muted{color:#796c8c;font-size:12px;line-height:1.3}
.price{font-size:16px;color:#9b4d86;font-weight:bold;margin:6px 0 4px}
.tag{display:inline-block;border-radius:20px;padding:2px 8px;background:#eee5ff;font-size:12px;white-space:nowrap}
.tag.ok{background:#d8f7e9}
.tag.sold{background:#e6e0ee;color:#5a4f6b}

.orders{display:flex;flex-direction:column;gap:10px}
.order{border:1.5px solid #d8cce8;border-radius:12px;padding:10px;background:#fcfaff;display:flex;flex-direction:column;gap:8px}
.order-top{display:flex;gap:10px;align-items:flex-start}
.order-thumb{width:48px;height:48px;border-radius:9px;border:1.5px solid var(--ink);object-fit:cover;background:#f3eaff;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.order-info{flex:1;min-width:0}
.order-title{font-size:15px;font-weight:bold;word-break:break-word;line-height:1.35}
.order-sub{font-size:13px;color:#66587a;margin-top:2px;word-break:break-word}
.order-money{font-size:14px;color:#9b4d86;font-weight:bold;margin-top:3px}
.order-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:6px;border-top:1px dashed #e2d8f0}
.order-times{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.order-actions{display:flex;gap:6px;align-items:center}
.order-count-badge{display:inline-block;background:#f3eaff;border:1px solid #cbb9df;border-radius:999px;padding:4px 10px;font-size:13px;margin-bottom:10px}

.sales-group{border:1.5px solid #d8cce8;border-radius:12px;padding:12px;background:#fcfaff;margin-bottom:12px}
.sales-group-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:8px;margin-bottom:8px;border-bottom:1.5px solid #e5dcf2}
.sales-date{font-size:16px;font-weight:bold}
.sales-total{font-size:15px;font-weight:bold;color:#9b4d86;background:#fffaf0;border:1px solid #e5bd5c;border-radius:999px;padding:3px 10px}
.sales-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #ebe3f7;font-size:14px}
.sales-row:last-child{border-bottom:none;padding-bottom:0}
.sales-row-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.sales-row-right{text-align:right;white-space:nowrap}

.sectiontitle{margin:0 0 12px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formgrid .wide{grid-column:1/-1}
.hidden{display:none!important}
.notice{background:#fff4ce;border:1px solid #e5bd5c;border-radius:9px;padding:10px;font-size:14px;margin-bottom:12px}
.modal-backdrop{position:fixed;inset:0;background:rgba(48,39,68,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);max-width:420px;width:100%;padding:18px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-head h3{margin:0}
.modal-close{width:auto;padding:4px 10px;background:#f3eaff}
.modal-summary{background:#f8f2ff;border:1px solid #d8cce8;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.modal-total{margin:12px 0;padding:10px 12px;background:#fffaf0;border:1px solid #e5bd5c;border-radius:10px;display:flex;justify-content:space-between;font-weight:bold}

@media(max-width:600px){
.grid{grid-template-columns:repeat(2,1fr);gap:10px}
.item img,.placeholder{height:110px;font-size:38px}
.itembody{padding:8px}
.item h3{font-size:15px}
.price{font-size:14px}
.itembody p{font-size:12px!important;margin:0 0 8px!important}
.itembody button{padding:7px;font-size:13px}
.formgrid{grid-template-columns:1fr}
.formgrid .wide{grid-column:auto}
.flex>*{flex-basis:100%}
.logo{font-size:22px}
}
</style>
</head>
<body>
<header>
<div id="headerExtra" class="header-custom"></div>
<div class="logo" id="headerTitle">설기 SHOP</div>
<div id="shopNotice" class="notice-banner"></div>
<div><span id="syncStatus" class="sync-pill">🟢 실시간 동기화 연결 중...</span></div>
</header>

<div class="wrap">
<div class="tabs">
<button id="shopTab" type="button" class="active" data-tab="shop">아이템</button>
<button id="ordersTab" type="button" data-tab="orders">주문 현황</button>
<button id="adminTab" type="button" data-tab="admin">관리자</button>
</div>

<section id="shop">
<div class="toolbar">
<div class="flex">
<input id="search" placeholder="아이템명 검색...">
<select id="categoryFilter"><option value="">전체 카테고리</option></select>
<select id="statusFilter">
<option value="">전체 상태</option>
<option value="available">판매중</option>
<option value="soldout">판매 완료</option>
</select>
<select id="sort">
<option value="new">최신 등록순</option>
<option value="price">가격 낮은순</option>
<option value="stock">재고 많은순</option>
</select>
</div>
<div class="tabs" style="margin:10px 0 0">
<button id="itemTypeTab" type="button" class="active" data-type="아이템">아이템</button>
<button id="furnitureTypeTab" type="button" data-type="가구">가구</button>
</div>
</div>
<div id="items" class="grid"></div>
</section>

<section id="orders" class="hidden">
<div class="panel">
<h2 class="sectiontitle">주문 현황</h2>
<div id="ordersCount" class="order-count-badge">대기 0건</div>
<div id="ordersNotice" class="notice">닉네임은 첫 글자만 공개돼요. 실시간으로 자동 갱신됩니다.</div>
<div id="publicOrders" class="orders"></div>
</div>
</section>

<section id="admin" class="hidden">
<div class="panel">
<h2>관리자 모드</h2>
<div class="notice">Firebase 실시간 DB와 연동되어 모든 접속자에게 상품·재고·주문 현황이 실시간 공유됩니다.</div>
<div id="adminGate">
<div class="flex">
<input id="adminPass" type="password" placeholder="관리자 비밀번호 (1234)">
<button id="adminLoginBtn" type="button" class="primary">로그인</button>
</div>
</div>
<div id="adminArea" class="hidden">
<h3>💬 디스코드 웹훅 주문 알림</h3>
<div class="formgrid" style="margin-bottom:16px">
<input id="webhookInput" class="wide" placeholder="디스코드 웹훅 URL (https://discord.com/api/webhooks/...)">
<span id="webhookStatusText" class="muted">웹훅 상태: 미설정</span>
<div class="flex" style="justify-content:flex-end">
<button id="testWebhookBtn" type="button" class="small">테스트 전송</button>
<button id="saveWebhookBtn" type="button" class="small primary">웹훅 저장</button>
</div>
</div>

<hr style="border:0;border-top:1px dashed #cbb9df;margin:20px 0">
<h3>📊 날짜별 거래 내역 및 총 판매 금액</h3>
<div id="salesSummaryBadge" class="order-count-badge">누적 총 판매 금액: 0원 (총 0건)</div>
<div id="salesHistory"></div>

<hr style="border:0;border-top:1px dashed #cbb9df;margin:20px 0">
<h3>상단 디자인 편집</h3>
<div class="formgrid">
<input id="titleInput" placeholder="사이트 타이틀 (예: 설기 SHOP)">
<input id="extraInput" placeholder="타이틀 위 작은 문구 (선택)">
<input id="headerColor" type="color" value="#ffd9e9" aria-label="상단 배경색">
<input id="headerImage" type="file" accept="image/*" aria-label="상단 배경 이미지">
<button id="clearHeaderImgBtn" type="button">배경 이미지 지우기</button>
<button id="saveHeaderBtn" type="button" class="primary">상단 디자인 적용</button>
</div>

<h3 style="margin-top:18px">공지 수정</h3>
<div class="flex">
<input id="noticeInput" placeholder="상단에 띄울 공지 메시지 (비우면 숨김)">
<button id="saveNoticeBtn" type="button" class="primary">공지 적용</button>
</div>

<hr style="border:0;border-top:1px dashed #cbb9df;margin:20px 0">
<h3>아이템 등록</h3>
<div class="formgrid">
<input id="pName" placeholder="아이템명 *">
<select id="pType"><option value="아이템">아이템</option><option value="가구">가구</option></select>
<select id="pCat"></select>
<input id="pPrice" type="number" min="0" placeholder="가격 *">
<input id="pStock" type="number" min="0" placeholder="재고 ">
<input id="pImage" type="file" accept="image/">
<input id="pDesc" placeholder="간단 설명">
<button id="addItemBtn" type="button" class="primary wide">상품 등록</button>
</div>

<hr style="border:0;border-top:1px dashed #cbb9df;margin:20px 0">
<h3>재고 / 상품 관리</h3>
<div id="manageItems" class="orders"></div>

<button id="adminLogoutBtn" type="button" class="danger" style="margin-top:18px">관리자 로그아웃</button>
</div>
</div>
</section>
</div>

<div id="orderModal" class="modal-backdrop hidden">
<div class="modal">
<div class="modal-head">
<h3>구매 신청</h3>
<button id="closeModalBtn" type="button" class="modal-close">✕</button>
</div>
<div id="modalSummary" class="modal-summary"></div>
<div class="formgrid">
<div class="wide">
<label class="muted" for="orderNick">게임 닉네임 *</label>
<input id="orderNick" placeholder="예: 설기#005" maxlength="30">
</div>
<div class="wide">
<label class="muted" for="orderQty">구매 수량 *</label>
<input id="orderQty" type="number" min="1" value="1">
</div>
</div>
<div class="modal-total">
<span>예상 결제 금액</span>
<span id="orderTotalPrice">0원</span>
</div>
<button id="submitOrderBtn" type="button" class="primary" style="width:100%">신청하기</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
<script>
(function(){
var DEFAULT_DISCORD_WEBHOOK_URL = '';
var ADMIN_PASS = '1234';
var AUTH_KEY = 'pixel_shop_admin_auth_v1';
var ITEM_CATS = ['모자','머리','눈','코스튬','페이스웨어','입장식','데코','스카프','핸드헬드','날개','망토','비지','꼬리','펫알','기타','경관','누충셋'];

var firebaseConfig = {
apiKey: "AIzaSyAIcxTWySAbEJ16MMWaRoDYNjHoM_nidaY",
authDomain: "shop-4ba83.firebaseapp.com",
databaseURL: "https://shop-4ba83-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "shop-4ba83",
storageBucket: "shop-4ba83.firebasestorage.app",
messagingSenderId: "554012081494",
appId: "1:554012081494:web:ff84a6776ce8fc8c86aaf7",
measurementId: "G-KW2HN33PN7"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var rootRef = db.ref('pixel_shop_v1');

var data = {
items: [],
orders: [],
salesLog: [],
notice: '',
header: { title: '설기 SHOP', extra: '', color: '#ffd9e9', image: '' },
webhookUrl: DEFAULT_DISCORD_WEBHOOK_URL
};

var logged = false;
try {
logged = sessionStorage.getItem(AUTH_KEY) === '1';
} catch (e) {}

var currentType = '아이템';
var activeOrderItemId = null;
var initialized = false;

function toArray(val) {
if (!val) return [];
if (Array.isArray(val)) return val.filter(Boolean);
return Object.keys(val).map(function(k) { return val[k]; }).filter(Boolean);
}

function formatStamp(d) {
var dt = d instanceof Date ? d : new Date(d || Date.now());
return ('0' + dt.getHours()).slice(-2) + ':' +
('0' + dt.getMinutes()).slice(-2) + ':' +
('0' + dt.getSeconds()).slice(-2);
}

function formatDateKey(d) {
var dt = d instanceof Date ? d : new Date(d || Date.now());
return dt.getFullYear() + '-' +
('0' + (dt.getMonth() + 1)).slice(-2) + '-' +
('0' + dt.getDate()).slice(-2);
}

function save() {
var itemsMap = {};
data.items.forEach(function(it) { itemsMap[it.id] = it; });
var ordersMap = {};
data.orders.forEach(function(o) { ordersMap[o.id] = o; });
var salesMap = {};
data.salesLog.forEach(function(s) { salesMap[s.id] = s; });

rootRef.set({
items: itemsMap,
orders: ordersMap,
salesLog: salesMap,
notice: data.notice || '',
header: data.header || { title: '설기 SHOP', extra: '', color: '#ffd9e9', image: '' },
webhookUrl: data.webhookUrl || DEFAULT_DISCORD_WEBHOOK_URL
}).catch(function(err) {
console.error('DB 저장 오류:', err);
});
}

function getWebhookUrl() {
var saved = String(data.webhookUrl || '').trim();
if (saved) return saved;
return String(DEFAULT_DISCORD_WEBHOOK_URL || '').trim();
}

function updateWebhookStatus() {
var inp = document.getElementById('webhookInput');
var st = document.getElementById('webhookStatusText');
var url = getWebhookUrl();
if (inp && document.activeElement !== inp) inp.value = url;
if (st) {
st.textContent = url
? '웹훅 상태: 설정됨 (주문 접수 시 디스코드로 전송)'
: '웹훅 상태: 미설정';
}
}

function sendDiscordOrderNotification(order, totalPrice, queueNumber) {
var url = getWebhookUrl();
if (!url || url.indexOf('https://discord.com/api/webhooks/') !== 0) return;

var payload = {
content: '🛍 새 주문이 접수됐어요! (대기 ' + queueNumber + '번)\n' +
'• 아이템: ' + order.itemName + '\n' +
'• 닉네임: ' + order.nick + '\n' +
'• 수량: ' + order.qty + '개\n' +
'• 결제 금액: ' + totalPrice + '원\n' +
'• 주문 시간: ' + order.time
};

try {
fetch(url, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload)
}).catch(function() {});
} catch (e) {}
}

function setLogged(val) {
logged = !!val;
try {
if (logged) sessionStorage.setItem(AUTH_KEY, '1');
else sessionStorage.removeItem(AUTH_KEY);
} catch (e) {}
syncAdminView();
}

function syncAdminView() {
document.getElementById('adminGate').classList.toggle('hidden', logged);
document.getElementById('adminArea').classList.toggle('hidden', !logged);
if (logged) {
updateWebhookStatus();
renderAdmin();
}
renderOrders();
}

function esc(str) {
return String(str == null ? '' : str)
.replace(/&/g, '&')
.replace(/</g, '<')
.replace(/>/g, '>')
.replace(/"/g, '"');
}

function masked(n) {
var t = String(n || '').trim();
if (!t) return '***';
return t.charAt(0) + '***';
}

function findItem(id) {
for (var i = 0; i < data.items.length; i++) {
if (data.items[i].id === id) return data.items[i];
}
return null;
}

function recordSale(order, doneNow) {
var item = findItem(order.itemId);
var unitPrice = Number(order.price != null ? order.price : (item ? item.price : 0)) || 0;
var qty = Number(order.qty) || 1;
var totalPrice = unitPrice * qty;
var exists = false;
for (var i = 0; i < data.salesLog.length; i++) {
if (data.salesLog[i].orderId === order.id) {
exists = true;
break;
}
}
if (!exists) {
data.salesLog.push({
id: String(Date.now()) + '_' + Math.random().toString(36).slice(2, 7),
orderId: order.id,
itemName: order.itemName,
image: order.image || (item ? item.image : ''),
nick: order.nick,
qty: qty,
unitPrice: unitPrice,
totalPrice: totalPrice,
orderTime: order.time || formatStamp(order.created),
processedTime: formatStamp(doneNow),
dateKey: formatDateKey(doneNow),
created: doneNow
});
}
}

function showTab(t) {
['shop', 'orders', 'admin'].forEach(function(x) {
document.getElementById(x).classList.toggle('hidden', x !== t);
});
['shopTab', 'ordersTab', 'adminTab'].forEach(function(x, i) {
document.getElementById(x).classList.toggle('active', ['shop', 'orders', 'admin'][i] === t);
});
if (t === 'orders') renderOrders();
if (t === 'admin') syncAdminView();
}

function setType(t) {
currentType = t;
document.getElementById('itemTypeTab').classList.toggle('active', t === '아이템');
document.getElementById('furnitureTypeTab').classList.toggle('active', t === '가구');
document.getElementById('categoryFilter').disabled = (t === '가구');
document.getElementById('categoryFilter').value = '';
document.getElementById('pType').value = t;
document.getElementById('pCat').disabled = (t === '가구');
renderShop();
}

function fillCats() {
var f = document.getElementById('categoryFilter');
var p = document.getElementById('pCat');
var opts = ITEM_CATS.map(function(c) {
return '<option value="' + esc(c) + '">' + esc(c) + '</option>';
}).join('');
f.innerHTML = '<option value="">전체 카테고리</option>' + opts;
p.innerHTML = opts;
}

function renderHeader() {
var h = data.header || {};
var hdr = document.querySelector('header');
document.getElementById('headerTitle').textContent = h.title || '설기 SHOP';
document.getElementById('headerExtra').textContent = h.extra || '';
hdr.style.backgroundColor = h.color || '#ffd9e9';
hdr.style.backgroundImage = h.image ? ('url("' + h.image + '")') : 'none';
if (document.activeElement !== document.getElementById('titleInput')) {
document.getElementById('titleInput').value = h.title || '';
}
if (document.activeElement !== document.getElementById('extraInput')) {
document.getElementById('extraInput').value = h.extra || '';
}
document.getElementById('headerColor').value = h.color || '#ffd9e9';
}

function renderNotice() {
document.getElementById('shopNotice').textContent = data.notice ? ('📢 ' + data.notice) : '';
if (document.activeElement !== document.getElementById('noticeInput')) {
document.getElementById('noticeInput').value = data.notice || '';
}
}

function renderShop() {
var q = document.getElementById('search').value.toLowerCase();
var cat = document.getElementById('categoryFilter').value;
var status = document.getElementById('statusFilter').value;
var sort = document.getElementById('sort').value;

var list = data.items.filter(function(x) {
var isSoldOut = Number(x.stock) <= 0;
var matchStatus = !status || (status === 'soldout' ? isSoldOut : !isSoldOut);
return (x.type || '아이템') === currentType &&
String(x.name || '').toLowerCase().indexOf(q) !== -1 &&
(!cat || x.cat === cat) &&
matchStatus;
});

if (sort === 'price') list.sort(function(x, y) { return x.price - y.price; });
if (sort === 'stock') list.sort(function(x, y) { return y.stock - x.stock; });
if (sort === 'new') list.sort(function(x, y) { return (y.created || 0) - (x.created || 0); });

document.getElementById('items').innerHTML = list.length ? list.map(function(x) {
var isSoldOut = Number(x.stock) <= 0;
var imgHtml = x.image
? '<img src="' + x.image + '" alt="' + esc(x.name) + '"><div class="placeholder" style="display:none">🎁</div>'
: '<div class="placeholder">🎁</div>';
return '<article class="item' + (isSoldOut ? ' soldout' : '') + '">' +
'<div class="item-media">' +
imgHtml +
(isSoldOut ? '<div class="soldout-badge">판매 완료</div>' : '') +
'</div>' +
'<div class="itembody">' +
'<div><span class="tag">' + esc(x.cat) + '</span> <span class="tag ' + (isSoldOut ? 'sold' : 'ok') + '">' + (isSoldOut ? '판매 완료' : '판매중') + '</span></div>' +
'<h3>' + esc(x.name) + '</h3>' +
'<div class="muted">' + esc(x.desc || '설명 없음') + '</div>' +
'<div class="price">' + Number(x.price) + '원</div>' +
'<p style="margin:0 0 10px;font-size:14px">재고 <b>' + x.stock + '</b>개</p>' +
'<button type="button" class="primary" style="width:100%;margin-top:auto" data-order-id="' + esc(x.id) + '" ' + (isSoldOut ? 'disabled' : '') + '>' + (isSoldOut ? '판매 완료' : '구매 신청') + '</button>' +
'</div>' +
'</article>';
}).join('') : '<div class="panel" style="grid-column:1/-1">표시할 상품이 없어요.</div>';
}

function renderOrders() {
var pendingList = data.orders
.filter(function(o) { return o.status === '대기'; })
.sort(function(x, y) { return x.created - y.created; });

document.getElementById('ordersCount').textContent = '대기 ' + pendingList.length + '건';

document.getElementById('publicOrders').innerHTML = pendingList.length ? pendingList.map(function(o, i) {
var orderLabel = '대기 ' + (i + 1) + '번';
var nickText = logged ? esc(o.nick) : masked(o.nick);
var item = findItem(o.itemId);
var imgSrc = o.image || (item ? item.image : '');
var unitPrice = Number(o.price != null ? o.price : (item ? item.price : 0)) || 0;
var totalPrice = unitPrice * (Number(o.qty) || 1);
var orderTimeText = o.time || (o.created ? formatStamp(o.created) : '-');
var thumbHtml = imgSrc
? '<img class="order-thumb" src="' + imgSrc + '" alt="' + esc(o.itemName) + '">'
: '<div class="order-thumb">🎁</div>';
var controls = logged
? '<div class="order-actions">' +
'<button type="button" class="small primary" data-done-id="' + esc(o.id) + '">완료</button>' +
'<button type="button" class="small" data-cancel-id="' + esc(o.id) + '">취소</button>' +
'</div>'
: '';
return '<div class="order">' +
'<div class="order-top">' +
thumbHtml +
'<div class="order-info">' +
'<div class="order-title">' + orderLabel + ' ' + esc(o.itemName) + '</div>' +
'<div class="order-sub">' + nickText + ' · ' + o.qty + '개</div>' +
'<div class="order-money">' + totalPrice + '원</div>' +
'</div>' +
'</div>' +
'<div class="order-meta">' +
'<div class="order-times">' +
'<span class="tag">대기</span>' +
'<span class="muted">주문 ' + esc(orderTimeText) + '</span>' +
'</div>' +
controls +
'</div>' +
'</div>';
}).join('') : '현재 대기 중인 주문이 없어요.';
}

function renderSalesHistory() {
var logs = data.salesLog.slice().sort(function(a, b) {
return (b.created || 0) - (a.created || 0);
});
var grandTotal = 0;
for (var i = 0; i < logs.length; i++) {
grandTotal += Number(logs[i].totalPrice) || 0;
}
document.getElementById('salesSummaryBadge').textContent =
'누적 총 판매 금액: ' + grandTotal + '원 (총 ' + logs.length + '건)';

if (!logs.length) {
document.getElementById('salesHistory').innerHTML = '<div class="muted">아직 완료된 거래 내역이 없어요.</div>';
return;
}

var groups = {};
var dateOrder = [];
for (var j = 0; j < logs.length; j++) {
var entry = logs[j];
var dk = entry.dateKey || formatDateKey(entry.created);
if (!groups[dk]) {
groups[dk] = { dateKey: dk, total: 0, items: [] };
dateOrder.push(dk);
}
groups[dk].total += Number(entry.totalPrice) || 0;
groups[dk].items.push(entry);
}

document.getElementById('salesHistory').innerHTML = dateOrder.map(function(dk) {
var grp = groups[dk];
var rowsHtml = grp.items.map(function(it) {
var thumb = it.image
? '<img class="order-thumb" style="width:36px;height:36px;font-size:16px" src="' + it.image + '" alt="' + esc(it.itemName) + '">'
: '<div class="order-thumb" style="width:36px;height:36px;font-size:16px">🎁</div>';
return '<div class="sales-row">' +
'<div class="sales-row-left">' +
thumb +
'<div>' +
'<div><b>' + esc(it.itemName) + '</b> <span class="muted">· ' + esc(it.nick) + ' · ' + it.qty + '개</span></div>' +
'<div class="muted">주문 ' + esc(it.orderTime || '-') + ' · 처리 ' + esc(it.processedTime || '-') + '</div>' +
'</div>' +
'</div>' +
'<div class="sales-row-right"><b>' + (Number(it.totalPrice) || 0) + '원</b></div>' +
'</div>';
}).join('');

return '<div class="sales-group">' +
'<div class="sales-group-head">' +
'<span class="sales-date">📅 ' + esc(dk) + ' (' + grp.items.length + '건)</span>' +
'<span class="sales-total">총 판매 금액 ' + grp.total + '원</span>' +
'</div>' +
rowsHtml +
'</div>';
}).join('');
}

function renderAdmin() {
if (!logged) return;
renderNotice();
renderHeader();
renderSalesHistory();
updateWebhookStatus();

document.getElementById('manageItems').innerHTML = data.items.length ? data.items.map(function(x) {
return '<div class="order">' +
'<div><b>' + esc(x.name) + '</b><div class="muted">' + esc(x.type || '아이템') + ' / ' + esc(x.cat) + ' · ' + Number(x.price) + '원</div></div>' +
'<label>재고 <input style="width:75px" type="number" min="0" value="' + x.stock + '" data-stock-id="' + esc(x.id) + '"></label>' +
'<button type="button" class="small danger" data-del-id="' + esc(x.id) + '">삭제</button>' +
'</div>';
}).join('') : '상품 없음';
}

function openOrderModal(id) {
var item = findItem(id);
if (!item || item.stock < 1) return;
activeOrderItemId = id;
document.getElementById('modalSummary').innerHTML =
'<div><b>' + esc(item.name) + '</b> <span class="tag">' + esc(item.cat) + '</span></div>' +
'<div class="muted" style="margin-top:4px">단가: ' + Number(item.price) + '원 · 현재 재고: <b>' + item.stock + '</b>개</div>';
document.getElementById('orderQty').max = item.stock;
document.getElementById('orderQty').value = 1;
document.getElementById('orderNick').value = '';
document.getElementById('orderTotalPrice').textContent = Number(item.price) + '원';
document.getElementById('orderModal').classList.remove('hidden');
}

function closeOrderModal() {
activeOrderItemId = null;
document.getElementById('orderModal').classList.add('hidden');
}

document.getElementById('shopTab').onclick = function() { showTab('shop'); };
document.getElementById('ordersTab').onclick = function() { showTab('orders'); };
document.getElementById('adminTab').onclick = function() { showTab('admin'); };
document.getElementById('itemTypeTab').onclick = function() { setType('아이템'); };
document.getElementById('furnitureTypeTab').onclick = function() { setType('가구'); };
document.getElementById('search').oninput = renderShop;
document.getElementById('categoryFilter').onchange = renderShop;
document.getElementById('statusFilter').onchange = renderShop;
document.getElementById('sort').onchange = renderShop;

document.getElementById('saveWebhookBtn').onclick = function() {
var val = document.getElementById('webhookInput').value.trim();
if (val && val.indexOf('https://discord.com/api/webhooks/') !== 0) {
alert('올바른 디스코드 웹훅 URL(https://discord.com/api/webhooks/...)을 입력해 주세요.');
return;
}
data.webhookUrl = val;
save();
updateWebhookStatus();
alert('디스코드 웹훅 URL이 실시간 DB에 저장됐어요!');
};

document.getElementById('testWebhookBtn').onclick = function() {
var val = document.getElementById('webhookInput').value.trim() || getWebhookUrl();
if (!val || val.indexOf('https://discord.com/api/webhooks/') !== 0) {
alert('먼저 디스코드 웹훅 URL을 입력해 주세요.');
return;
}
fetch(val, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ content: '🔔 설기 SHOP 테스트 알림 — 디스코드 웹훅이 정상 연결됐어요!' })
}).then(function(res) {
if (res.ok) {
alert('디스코드로 테스트 알림을 보냈어요!');
} else {
alert('전송 실패(응답 코드: ' + res.status + '). 웹훅 URL을 다시 확인해 주세요.');
}
}).catch(function() {
alert('네트워크 오류로 전송에 실패했어요. 인터넷 연결을 확인해 주세요.');
});
};

document.getElementById('adminLoginBtn').onclick = function() {
if (document.getElementById('adminPass').value === ADMIN_PASS) {
setLogged(true);
} else {
alert('비밀번호가 틀렸어요.');
}
};

document.getElementById('adminLogoutBtn').onclick = function() {
document.getElementById('adminPass').value = '';
setLogged(false);
};

document.getElementById('closeModalBtn').onclick = closeOrderModal;
document.getElementById('orderModal').onclick = function(e) {
if (e.target === this) closeOrderModal();
};

document.getElementById('pType').onchange = function() {
document.getElementById('pCat').disabled = (document.getElementById('pType').value === '가구');
};

document.getElementById('clearHeaderImgBtn').onclick = function() {
if (!data.header) data.header = { title: '설기 SHOP', extra: '', color: '#ffd9e9', image: '' };
data.header.image = '';
document.getElementById('headerImage').value = '';
save();
renderHeader();
alert('배경 이미지를 지웠어요!');
};

document.getElementById('saveHeaderBtn').onclick = function() {
var fileInput = document.getElementById('headerImage');
var file = fileInput.files && fileInput.files[0];
var prevImg = (data.header && data.header.image) || '';

function finishHeader(imgData) {
data.header = {
title: document.getElementById('titleInput').value.trim() || '설기 SHOP',
extra: document.getElementById('extraInput').value.trim(),
color: document.getElementById('headerColor').value,
image: imgData
};
save();
renderHeader();
fileInput.value = '';
alert('상단 디자인 적용 완료!');
}

if (file) {
if (file.size > 1.5 * 1024 * 1024) {
alert('이미지는 1.5MB 이하로 선택해 주세요.');
return;
}
var fr = new FileReader();
fr.onload = function() { finishHeader(fr.result); };
fr.readAsDataURL(file);
} else {
finishHeader(prevImg);
}
};

document.getElementById('saveNoticeBtn').onclick = function() {
data.notice = document.getElementById('noticeInput').value.trim();
save();
renderNotice();
alert('공지 적용 완료!');
};

document.getElementById('addItemBtn').onclick = function() {
var name = document.getElementById('pName').value.trim();
var rawPrice = document.getElementById('pPrice').value;
var rawStock = document.getElementById('pStock').value;
var price = Number(rawPrice);
var stock = parseInt(rawStock, 10);
var fileInput = document.getElementById('pImage');
var file = fileInput.files && fileInput.files[0];

if (!name || rawPrice === '' || rawStock === '' || isNaN(price) || price < 0 || isNaN(stock) || stock < 0) {
alert('아이템명, 가격, 재고를 입력해 주세요.');
return;
}

function finishAdd(imageData) {
var type = document.getElementById('pType').value;
var cat = type === '가구' ? '가구' : document.getElementById('pCat').value;
data.items.push({
id: String(Date.now()) + '_' + Math.random().toString(36).slice(2, 7),
name: name,
type: type,
cat: cat,
price: price,
stock: stock,
image: imageData || '',
desc: document.getElementById('pDesc').value.trim(),
created: Date.now()
});
save();
['pName','pPrice','pStock','pImage','pDesc'].forEach(function(id){ document.getElementById(id).value = ''; });
renderAdmin();
renderShop();
alert('상품 등록 완료!');
}

if (file) {
if (file.size > 1.2 * 1024 * 1024) {
alert('이미지는 1.2MB 이하로 선택해 주세요.');
return;
}
var fr = new FileReader();
fr.onload = function() { finishAdd(fr.result); };
fr.readAsDataURL(file);
} else {
finishAdd('');
}
};

document.getElementById('orderQty').oninput = function() {
var item = findItem(activeOrderItemId);
if (!item) return;
var qty = Math.max(1, parseInt(this.value, 10) || 1);
document.getElementById('orderTotalPrice').textContent = (Number(item.price) * qty) + '원';
};

document.getElementById('submitOrderBtn').onclick = function() {
var item = findItem(activeOrderItemId);
if (!item || item.stock < 1) { closeOrderModal(); return; }
var nick = document.getElementById('orderNick').value.trim();
var qty = parseInt(document.getElementById('orderQty').value, 10);
if (!nick) { alert('게임 닉네임을 입력해 주세요.'); return; }
if (!qty || qty < 1 || qty > item.stock) { alert('구매 수량을 확인해 주세요. (최대 ' + item.stock + '개)'); return; }

var now = new Date();
var stamp = formatStamp(now);
var unitPrice = Number(item.price) || 0;
var totalPrice = unitPrice * qty;

item.stock = Math.max(0, Number(item.stock) - qty);

var newOrder = {
id: String(Date.now()) + '_' + Math.random().toString(36).slice(2, 7),
itemId: item.id,
itemName: item.name,
image: item.image || '',
price: unitPrice,
nick: nick,
qty: qty,
time: stamp,
processedTime: '',
created: now.getTime(),
updated: now.getTime(),
status: '대기'
};

data.orders.push(newOrder);
var pendingCount = data.orders.filter(function(o) { return o.status === '대기'; }).length;

save();
sendDiscordOrderNotification(newOrder, totalPrice, pendingCount);
closeOrderModal();
renderShop();
renderOrders();
alert('구매 신청이 접수됐어요!');
};

document.body.onclick = function(e) {
var t = e.target;
if (t.getAttribute('data-order-id')) openOrderModal(t.getAttribute('data-order-id'));
if (t.getAttribute('data-del-id')) {
var did = t.getAttribute('data-del-id');
if (confirm('상품을 삭제할까요?')) {
data.items = data.items.filter(function(x){ return x.id !== did; });
save(); renderAdmin(); renderShop();
}
}
if (t.getAttribute('data-done-id')) {
if (!logged) return;
var oid = t.getAttribute('data-done-id');
for (var i = 0; i < data.orders.length; i++) {
if (data.orders[i].id === oid) {
var doneNow = Date.now();
data.orders[i].status = '완료';
data.orders[i].processedTime = formatStamp(doneNow);
data.orders[i].updated = doneNow;
recordSale(data.orders[i], doneNow);
var doneItem = findItem(data.orders[i].itemId);
if (doneItem && Number(doneItem.stock) <= 0) {
doneItem.stock = 0;
}
}
}
save(); renderShop(); renderAdmin(); renderOrders();
}
if (t.getAttribute('data-cancel-id')) {
if (!logged) return;
var cid = t.getAttribute('data-cancel-id');
for (var j = 0; j < data.orders.length; j++) {
var o = data.orders[j];
if (o.id === cid) {
var it = findItem(o.itemId);
var cancelNow = Date.now();
if (it) it.stock = Number(it.stock || 0) + Number(o.qty || 0);
o.status = '취소';
o.processedTime = formatStamp(cancelNow);
o.updated = cancelNow;
}
}
save(); renderShop(); renderAdmin(); renderOrders();
}
};

document.body.onchange = function(e) {
var sid = e.target.getAttribute('data-stock-id');
if (sid) {
var n = parseInt(e.target.value, 10);
if (!isNaN(n) && n >= 0) {
var it = findItem(sid);
if (it) it.stock = n;
save(); renderShop(); renderAdmin();
}
}
};

db.ref('.info/connected').on('value', function(snap) {
var el = document.getElementById('syncStatus');
if (!el) return;
if (snap.val() === true) {
el.textContent = '🟢 실시간 공용 DB 연결됨';
} else {
el.textContent = '🟡 연결 확인 중...';
}
});

rootRef.on('value', function(snap) {
var val = snap.val();
if (!val && !initialized) {
initialized = true;
save();
return;
}
initialized = true;
val = val || {};
data.items = toArray(val.items);
data.orders = toArray(val.orders);
data.salesLog = toArray(val.salesLog);
data.notice = typeof val.notice === 'string' ? val.notice : '';
data.header = val.header && typeof val.header === 'object'
? val.header
: { title: '설기 SHOP', extra: '', color: '#ffd9e9', image: '' };
data.webhookUrl = typeof val.webhookUrl === 'string' && val.webhookUrl
? val.webhookUrl
: DEFAULT_DISCORD_WEBHOOK_URL;

renderNotice();
renderHeader();
renderShop();
renderOrders();
if (logged) renderAdmin();
}, function(err) {
var el = document.getElementById('syncStatus');
if (el) el.textContent = '🔴 DB 연결 실패 (' + (err && err.code ? err.code : '권한 확인 필요') + ')';
});

fillCats();
renderNotice();
renderHeader();
renderShop();
syncAdminView();
})();
</script>
